# Entry side (Iran), direct mode, through DNS resolvers: for a shutdown that leaves only DNS.
# Pair: exit-dns-resolvers.toml.
#
# The entry sends its packets as DNS queries to ordinary resolvers (the ones that still work
# from this server: the data centre's or the ISP's), which pass them on to the exit as the
# authoritative server of the tunnel domain. Slow (tens to a few hundred KB/s), but it gets
# out where nothing else does.
#
# Set up the domain first, at your DNS provider:
#   ns.example.com.  A   EXIT_SERVER_IP
#   t.example.com.   NS  ns.example.com.
role = "entry"
mode = "direct"
profile = "balanced"

[tunnel]
transport = "dns"
remote = "EXIT_SERVER_IP:53"    # the exit; the traffic itself goes through the resolvers
token = "CHANGE-ME-run-wormhole-token"

[tunnel.dns]
domain = "t.example.com"                        # or several: ["t.example.com", "t.example.net"]
# IP, IP:port, CIDR or CIDR:port. Each is tested first; the ones that answer are used and
# the ones that stop are set aside. In a shutdown: the ones that may answer here (the data
# centre's, the ISP's, a range of them).
resolvers = ["8.8.8.8", "1.1.1.1", "9.9.9.9"]
# resolvers_file = "/etc/wormhole/resolvers.txt"   # more, one or more per line
duplicate = 2                                   # each packet through two resolvers
setup_duplicate = 3                             # three while a connection starts
balance = "hybrid"                              # round trip weighed up by losses
# base64 = true                                 # if a resolver mangles binary answers
# scan_save = "/var/lib/wormhole/resolvers-ok.txt"   # the ones that passed the test
# `wormhole dns-scan -c this-file` tests the resolvers by hand.

[[forward]]
listen = "0.0.0.0:443"
target = "127.0.0.1:443"

[log]
level = "info"
