# Exit side (abroad), direct mode: the authoritative DNS server of the tunnel domain.
# Pair: entry-dns-resolvers.toml. Needs UDP 53 open, and root (or CAP_NET_BIND_SERVICE) to
# bind it. The domain's NS record must point at this server (see the entry's file).
role = "exit"
mode = "direct"
profile = "balanced"

[tunnel]
transport = "dns"
listen = "0.0.0.0:53"
token = "CHANGE-ME-run-wormhole-token"

[tunnel.dns]
domain = "t.example.com"        # the same domain(s) as the entry
# fallback = "1.1.1.1"          # answer other names through this server (else refused)

[log]
level = "info"
